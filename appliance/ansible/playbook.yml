---
# projectM appliance configuration.
#
# Applies to the local machine by default (see bootstrap.sh). Each role dispatches to a per-OS
# task file (Darwin.yml / Linux.yml) via ansible_system, so macOS and Linux share this playbook.
- name: Configure projectM appliance
  hosts: all
  gather_facts: true

  pre_tasks:
    - name: Fail early on unsupported platforms
      ansible.builtin.assert:
        that: ansible_system in ["Darwin", "Linux"]
        fail_msg: >-
          Only macOS (Darwin) and Linux are supported. Each role dispatches to a per-OS task file
          ({{ ansible_system }}.yml); add another for a new platform.

  # Tags let you apply roles selectively, e.g. `./bootstrap.sh --tags autostart`. When the
  # `just deploy-to-user` bundle already seeded ~/.projectM/config.inp, skip the config role
  # with `--skip-tags config` (or run `--tags autostart,autologin`).
  roles:
    - role: user        # create the low-privilege appliance account
      tags: [user]
    - role: config      # write ~/.projectM/config.inp
      tags: [config]
    - role: autostart   # run projectM fullscreen at login (macOS LaunchAgent / Linux XDG autostart)
      tags: [autostart]
    - role: autologin   # enable automatic login for the appliance user (macOS kcpassword / Linux GDM)
      when: enable_autologin | bool
      tags: [autologin]
