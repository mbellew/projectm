---
# Write the appliance user's ~/.projectM/config.inp.
- name: Ensure ~/.projectM exists
  become: true
  ansible.builtin.file:
    path: "/Users/{{ appliance_user }}/.projectM"
    state: directory
    owner: "{{ appliance_user }}"
    group: staff
    mode: "0755"

- name: Render config.inp
  become: true
  ansible.builtin.template:
    src: config.inp.j2
    dest: "/Users/{{ appliance_user }}/.projectM/config.inp"
    owner: "{{ appliance_user }}"
    group: staff
    mode: "0644"
