---
# Create a low-privilege local macOS account for the appliance, idempotently.
# macOS has no first-class Ansible user module for local accounts, so we use dscl directly.

- name: Check whether the appliance user already exists
  ansible.builtin.command: "/usr/bin/dscl . -read /Users/{{ appliance_user }}"
  register: user_check
  changed_when: false
  failed_when: false

- name: Create the appliance user
  when: user_check.rc != 0
  become: true
  block:
    - name: Find an unused UniqueID (>= 600)
      ansible.builtin.shell: >-
        set -o pipefail;
        max=$(/usr/bin/dscl . -list /Users UniqueID | awk '{print $2}' | sort -n | tail -1);
        echo $(( max < 600 ? 600 : max + 1 ))
      args:
        executable: /bin/bash
      register: next_uid
      changed_when: false

    - name: Create the user record
      ansible.builtin.command: "/usr/bin/dscl . -create /Users/{{ appliance_user }}"

    - name: Set login shell
      ansible.builtin.command: "/usr/bin/dscl . -create /Users/{{ appliance_user }} UserShell /bin/zsh"

    - name: Set full name
      ansible.builtin.command: >-
        /usr/bin/dscl . -create /Users/{{ appliance_user }} RealName "{{ appliance_user_fullname }}"

    - name: Set UniqueID
      ansible.builtin.command: "/usr/bin/dscl . -create /Users/{{ appliance_user }} UniqueID {{ next_uid.stdout }}"

    - name: Set primary group to staff (20)
      ansible.builtin.command: "/usr/bin/dscl . -create /Users/{{ appliance_user }} PrimaryGroupID 20"

    - name: Set home directory path
      ansible.builtin.command: >-
        /usr/bin/dscl . -create /Users/{{ appliance_user }} NFSHomeDirectory /Users/{{ appliance_user }}

    - name: Set the account password
      ansible.builtin.command: >-
        /usr/bin/dscl . -passwd /Users/{{ appliance_user }} "{{ appliance_user_password }}"
      no_log: true

    - name: Create and populate the home directory
      ansible.builtin.command: "/usr/sbin/createhomedir -c -u {{ appliance_user }}"
      args:
        creates: "/Users/{{ appliance_user }}"
